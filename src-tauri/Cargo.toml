[package]
name = "novasvn"
version = "0.1.0"
description = "NovaSVN desktop client"
authors = ["NovaSVN Contributors"]
edition = "2021"

[lib]
name = "novasvn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-drag = "2.1.1"
roxmltree = "0.21.1"
quick-xml = "0.39.4"
sha2 = "0.10.9"
