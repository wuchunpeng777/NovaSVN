[package]
name = "novasvn"
version = "0.3.2"
description = "Open-source desktop Subversion client for Windows and macOS"
authors = ["NovaSVN Contributors"]
license = "MIT"
repository = "https://github.com/wuchunpeng777/NovaSVN"
edition = "2021"

[lib]
name = "novasvn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-drag = "2.1.1"
tauri-plugin-clipboard-manager = "2.3.2"
roxmltree = "0.21.1"
quick-xml = "0.39.4"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
