[package]
name = "novasvn"
version = "0.1.0"
description = "NovaSVN desktop client"
authors = ["NovaSVN Contributors"]
edition = "2021"

[lib]
name = "novasvn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
